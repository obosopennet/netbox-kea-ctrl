{% extends 'base/layout.html' %}

{% block content %}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-2">
      <a class="btn btn-sm btn-outline-secondary"
         href="{% url 'plugins:netbox_kea_ctrl:keasharednetwork' pk=object.pk %}">
        <i class="mdi mdi-arrow-left"></i> {{ object.name }}
      </a>
      <h1 class="mb-0">Add Prefix to Shared Network</h1>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <strong>Assign Prefix</strong>
    </div>
    <div class="card-body">
      <p class="text-muted">
        Available prefixes: {{ candidate_count }}
      </p>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Assign Prefix</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
